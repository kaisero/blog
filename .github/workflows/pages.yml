name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Pinned deliberately: the design system depends on Blowfish's class
      # names, so Hugo and the theme are upgraded together and re-checked.
      HUGO_VERSION: 0.165.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # .Lastmod needs full history

      - name: Install Hugo
        run: |
          curl -sSL -o hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        # The base URL comes from the Pages API so this works unchanged on
        # *.github.io and on the custom domain once it is attached.
        run: hugo --minify --gc --baseURL "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
