# -- Theme Options --
# https://blowfish.page/docs/configuration/#theme-parameters
#
# Values marked "design system" are normative — they come from
# DESIGN-SYSTEM.md and must not be changed without changing the spec.

colorScheme = "dependencyhell"  # design system: assets/css/schemes/dependencyhell.css
# Must be "light" for autoSwitchAppearance to actually follow the OS: the theme's
# appearance.js adds .dark unconditionally when defaultAppearance is "dark" and no
# choice is stored, and its auto-switch branch only ever *adds* dark on load. With
# "light" the OS query is what decides, which is the intended behaviour here.
defaultAppearance = "light"
autoSwitchAppearance = true     # follow the reader's system setting

enableA11y = true
enableSearch = true
enableCodeCopy = true
enableStructuredBreadcrumbs = false
enableStyledScrollbar = true

replyByEmail = false

mainSections = ["posts"]

disableImageOptimization = false
disableImageOptimizationMD = false
disableTextInHeader = false

hotlinkFeatureImage = false
thumbnailAspectRatio = "1.5"

smartTOC = true
smartTOCHideUnfocusedChildren = false
highlightCurrentMenuArea = true

fingerprintAlgorithm = "sha512"

[header]
  layout = "fixed-fill-blur"  # design system: fixed, hairline, blurred

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "custom"  # design system: masthead + dense post list (layouts/partials/home/custom.html)
  showRecent = false
  cardView = true

[article]
  showDate = true
  showDateOnlyInArticle = false
  showDateUpdated = false
  showAuthor = true
  showHero = true
  heroStyle = "background"
  layoutBackgroundBlur = true
  layoutBackgroundHeaderSpace = true
  showBreadcrumbs = false
  showDraftLabel = true
  showEdit = false
  seriesOpened = false
  showHeadingAnchors = true
  showPagination = true
  invertPagination = false
  showReadingTime = true
  showTableOfContents = true  # design system: 182px sticky TOC
  showRelatedContent = true
  relatedContentLimit = 3
  showTaxonomies = true
  showCategories = false
  showTags = true
  showAuthorsBadges = false
  showWordCount = false
  showZenMode = false

[list]
  showHero = false
  showBreadcrumbs = false
  showSummary = true   # design system: summaries earn their line
  showTableOfContents = false
  showCards = false
  orderByWeight = false
  groupByYear = false
  cardView = true
  constrainItemsWidth = false

[sitemap]
  excludedKinds = ["taxonomy", "term"]

[taxonomy]
  showTermCount = true
  showHero = false
  showBreadcrumbs = false
  showTableOfContents = false
  cardView = true

[term]
  showHero = false
  showBreadcrumbs = false
  showTableOfContents = false
  groupByYear = false
  cardView = true
