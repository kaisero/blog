<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="presentation">
  <!-- See posture-check-fails-open/background.svg for the rationale: large
       mid-tone forms, one hue, linear gradients only. -->
  <defs>
    <linearGradient id="agBase" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#0A4E5E"/>
      <stop offset="0.55" stop-color="#0A3A47"/>
      <stop offset="1" stop-color="#01202E"/>
    </linearGradient>
    <linearGradient id="agBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00C0E8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00C0E8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#agBase)"/>

  <!-- broad wedges radiating from one principal -->
  <g fill="url(#agBeam)">
    <path d="M300 450 L1600 60 L1600 190 Z"/>
    <path d="M300 450 L1600 300 L1600 400 Z"/>
    <path d="M300 450 L1600 520 L1600 620 Z"/>
    <path d="M300 450 L1600 740 L1600 880 Z"/>
  </g>

  <circle cx="300" cy="450" r="150" fill="none" stroke="#00C0E8" stroke-width="58" stroke-opacity="0.8"/>
  <circle cx="300" cy="450" r="52" fill="#7FE4F7" fill-opacity="0.8"/>

  <rect x="0" y="0" width="1600" height="110" fill="#0196B3" fill-opacity="0.14"/>
</svg>
