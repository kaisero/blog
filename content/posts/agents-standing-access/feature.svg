<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" class="dh-thumb" role="img" aria-label="One node holding standing edges to many resources">
  <g class="t-grid" stroke="#00C0E8" stroke-opacity=".07" fill="none">
    <path d="M0 80.5H600M0 160.5H600M0 240.5H600M0 320.5H600"/>
    <path d="M120.5 0V400M240.5 0V400M360.5 0V400M480.5 0V400"/>
  </g>

  <!-- standing edges from a single principal -->
  <g class="t-edge" stroke="#0196B3" stroke-opacity=".55" fill="none" stroke-width="1.5">
    <path d="M150 200 L430 72"/>
    <path d="M150 200 L430 136"/>
    <path d="M150 200 L430 200"/>
    <path d="M150 200 L430 264"/>
    <path d="M150 200 L430 328"/>
  </g>

  <!-- the resources it can always reach -->
  <g class="t-line" stroke="#7FA8B5" fill="none" stroke-width="2">
    <rect x="418" y="60" width="24" height="24" rx="4"/>
    <rect x="418" y="124" width="24" height="24" rx="4"/>
    <rect x="418" y="188" width="24" height="24" rx="4"/>
    <rect x="418" y="252" width="24" height="24" rx="4"/>
    <rect x="418" y="316" width="24" height="24" rx="4"/>
  </g>

  <!-- the agent: one credential, no expiry -->
  <circle class="t-accent" stroke="#00C0E8" cx="150" cy="200" r="34" fill="none" stroke-width="10"/>
  <circle class="t-ink" fill="#E8F6FA" cx="150" cy="200" r="10"/>

  <rect class="t-rule" fill="#00C0E8" fill-opacity=".55" x="48" y="336" width="120" height="1"/>
</svg>
