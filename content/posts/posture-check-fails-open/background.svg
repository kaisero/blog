<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="presentation">
  <!-- Background art for the article hero. Deliberately different from the card
       thumbnail: it is seen blurred and under a heavy scrim, so it is built from
       large mid-tone forms rather than hairlines, which would vanish. Linear
       gradients and one hue only, per the design system. Mid-tone on purpose so
       it reads under both the dark and the light scrim. -->
  <defs>
    <linearGradient id="pcBase" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#0A4E5E"/>
      <stop offset="0.55" stop-color="#0A3A47"/>
      <stop offset="1" stop-color="#01202E"/>
    </linearGradient>
    <linearGradient id="pcArc" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#00C0E8"/>
      <stop offset="1" stop-color="#0196B3"/>
    </linearGradient>
    <linearGradient id="pcWash" x1="0" y1="1" x2="0.6" y2="0">
      <stop offset="0" stop-color="#00C0E8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#00C0E8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#pcBase)"/>
  <rect width="1600" height="900" fill="url(#pcWash)"/>

  <!-- the ring that holds, and the one broken open -->
  <circle cx="1080" cy="430" r="210" fill="none" stroke="url(#pcArc)" stroke-width="66" stroke-opacity="0.85"/>
  <path d="M1080 90 A340 340 0 1 1 840 930" fill="none" stroke="#00C0E8" stroke-width="54" stroke-opacity="0.5"/>
  <circle cx="1080" cy="430" r="66" fill="#7FE4F7" fill-opacity="0.75"/>

  <!-- broad tonal bands, which survive the blur -->
  <rect x="0" y="640" width="1600" height="120" fill="#0196B3" fill-opacity="0.16"/>
  <rect x="0" y="180" width="900" height="90" fill="#00C0E8" fill-opacity="0.1"/>
</svg>
