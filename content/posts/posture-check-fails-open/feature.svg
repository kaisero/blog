<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" class="dh-thumb" role="img" aria-label="Concentric rings with a gap — a check that fails open">
  <g class="t-grid">
    <path d="M0 80.5H600M0 160.5H600M0 240.5H600M0 320.5H600"/>
    <path d="M80.5 0V400M160.5 0V400M240.5 0V400M320.5 0V400M400.5 0V400M480.5 0V400"/>
  </g>

  <!-- closed ring: the check that holds -->
  <circle class="t-deep" cx="300" cy="200" r="54" fill="none" stroke-width="10"/>

  <!-- outer ring, broken open at the right: unknown was never given a verdict -->
  <path class="t-accent" d="M300 96 A104 104 0 1 1 227 353" fill="none" stroke-width="10" stroke-linecap="butt"/>

  <!-- the gap, drawn as absence -->
  <path class="t-ghost" d="M300 96 A104 104 0 0 1 373 353" fill="none" stroke-width="10" stroke-dasharray="2 14" stroke-linecap="round"/>

  <circle class="t-ink" cx="300" cy="200" r="12"/>

  <rect class="t-rule" x="48" y="336" width="120" height="1"/>
</svg>
