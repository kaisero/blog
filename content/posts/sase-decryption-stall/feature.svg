<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" class="dh-thumb" role="img" aria-label="Traffic lanes through an inspection point, with one lane bypassing it">
  <g class="t-grid" stroke="#00C0E8" stroke-opacity=".07" fill="none">
    <path d="M0 80.5H600M0 160.5H600M0 240.5H600M0 320.5H600"/>
    <path d="M120.5 0V400M240.5 0V400M360.5 0V400M480.5 0V400"/>
  </g>

  <!-- inspected lanes: they pass through the decryption point -->
  <g class="t-accent" stroke="#00C0E8" stroke-width="3" fill="none">
    <path d="M40 128 H560"/>
    <path d="M40 200 H560"/>
    <path d="M40 272 H560"/>
  </g>

  <!-- the bypass: routed around, never opened -->
  <path class="t-line" stroke="#7FA8B5" d="M40 336 H236 C282 336 282 366 328 366 H560" fill="none"
        stroke-width="3" stroke-dasharray="10 8"/>

  <!-- the decryption point -->
  <rect class="t-plate t-accent" fill="#000508" stroke="#00C0E8" x="270" y="92" width="60" height="216" stroke-width="2" rx="6"/>
  <g class="t-ink-stroke" stroke="#E8F6FA" fill="none" stroke-width="3">
    <path d="M288 190 H312"/>
    <path d="M288 200 H312"/>
    <path d="M288 210 H312"/>
  </g>

  <rect class="t-rule" fill="#00C0E8" fill-opacity=".55" x="48" y="60" width="120" height="1"/>
</svg>
